<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0211自动找币防爆仓救世之星</title>
    <meta name="description" content="币安交易所终极风控系统 - 集成『救世实验室』内核分析与智能选币引擎，具备强大的异常自愈与实况监控能力。" />
    <meta property="og:title" content="0211自动找币防爆仓救世之星" />
    <meta property="og:description" content="币安交易所终极风控系统 - 集成『救世实验室』内核分析与智能选币引擎，具备强大的异常自愈与实况监控能力。" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background-color: #0f172a; /* Slate 900 */
        color: #e2e8f0; /* Slate 200 */
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }

      /* 🚀 [Chromium Native Rendering Virtualization & Containment] */
      .crypto-virtual-card {
        content-visibility: auto;
        contain-intrinsic-size: 0 88px;
        contain: layout style paint;
      }
      .crypto-virtual-row {
        content-visibility: auto;
        contain-intrinsic-size: 0 42px;
        contain: layout style paint;
      }

      /* 🚀 [Electron Desktop PC Client Input Focus & Selection Fix] */
      /* 修复 PC 客户端环境下数字输入框 (-webkit-app-region: drag / select-none) 无法定位光标与直接打字的问题 */
      input, textarea, select, [contenteditable="true"] {
        -webkit-app-region: no-drag !important;
        -webkit-user-select: text !important;
        user-select: text !important;
        pointer-events: auto !important;
      }
      input[type="number"] {
        -webkit-app-region: no-drag !important;
        -webkit-user-select: text !important;
        user-select: text !important;
      }
      input:not(:disabled), textarea:not(:disabled), select:not(:disabled) {
        cursor: text;
      }
    </style>
</head>
  <body>
    <div id="root">
      <!-- 🛡️ 系统极速启动屏障：消除任何重启/升级后的蓝屏等待，毫秒级响应并自带自愈修复 -->
      <div id="boot-shield" style="position:fixed;inset:0;background:radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:9999999;padding:24px;box-sizing:border-box;">
        <div style="max-width:440px;width:100%;background:rgba(30,41,59,0.7);backdrop-filter:blur(16px);border:1px solid #334155;border-radius:24px;padding:32px 24px;text-align:center;box-shadow:0 20px 40px -15px rgba(0,0,0,0.7);">
          <!-- 动态呼吸光环 -->
          <div style="position:relative;width:64px;height:64px;margin:0 auto 20px auto;">
            <div style="position:absolute;inset:0;border-radius:50%;border:2px solid #6366f1;animation:boot-spin 1.5s linear infinite;border-top-color:transparent;"></div>
            <div style="position:absolute;inset:4px;border-radius:50%;background:#4f46e5;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 0 20px rgba(99,102,241,0.5);">
              🛡️
            </div>
          </div>
          <h2 style="margin:0 0 8px 0;font-size:18px;font-weight:900;color:#f8fafc;letter-spacing:-0.02em;">防爆仓救世之星</h2>
          <p id="boot-status-text" style="margin:0 0 20px 0;font-size:12px;color:#94a3b8;font-family:monospace;">正在载入风控核心引擎与交易系统...</p>
          
          <!-- 启动进度条 -->
          <div style="width:100%;height:4px;background:#1e293b;border-radius:999px;overflow:hidden;margin-bottom:20px;border:1px solid #334155;">
            <div id="boot-progress-bar" style="width:25%;height:100%;background:linear-gradient(90deg,#4f46e5,#38bdf8);border-radius:999px;transition:width 0.6s ease;"></div>
          </div>

          <!-- 诊断与超时自愈选项 (在等待超过5秒或异常时自动展现) -->
          <div id="boot-fallback-tools" style="display:none;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid #334155;">
            <div id="boot-diag-msg" style="display:none;font-size:11px;color:#f87171;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);padding:8px 12px;border-radius:8px;margin-bottom:8px;text-align:left;word-break:break-all;"></div>
            <button onclick="window.__SAVIOR_FORCE_RELOAD__()" style="background:#4f46e5;color:#fff;border:none;padding:10px;border-radius:10px;font-size:12px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;">
              🔄 立即重新加载
            </button>
            <button onclick="window.__SAVIOR_REPAIR_CACHE__()" style="background:rgba(59,130,246,0.15);color:#60a5fa;border:1px solid rgba(59,130,246,0.3);padding:10px;border-radius:10px;font-size:12px;font-weight:bold;cursor:pointer;">
              🧹 快速修复缓存并重启 (保留持仓与设置)
            </button>
          </div>
        </div>
      </div>
      <style>
        @keyframes boot-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
      <script>
        (function() {
          var CURRENT_BUILD_SIG = "2026.11.05.v5_AUTO_HEAL_SYNC";
          var bar = document.getElementById('boot-progress-bar');
          var text = document.getElementById('boot-status-text');
          var tools = document.getElementById('boot-fallback-tools');
          var diag = document.getElementById('boot-diag-msg');
          var shield = document.getElementById('boot-shield');
          
          // 🛡️ [1. 异步非阻塞版本迁移与缓存预热 (Async Non-blocking Cache Cleanup)]
          setTimeout(function() {
            try {
              var lastBuildSig = localStorage.getItem("SAVIOR_INSTALLED_BUILD_SIG");
              var isNewVersion = lastBuildSig !== CURRENT_BUILD_SIG;
              
              var totalStorageChars = 0;
              for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                totalStorageChars += (localStorage.getItem(k) || '').length;
              }
              var isStorageBloated = totalStorageChars > 2.5 * 1024 * 1024;

              if (isNewVersion || isStorageBloated) {
                console.log("[Boot Shield] 🚀 检测到版本更新或缓存空间，正在后台异步对齐...");
                var keysToPurge = [];
                for (var j = 0; j < localStorage.length; j++) {
                  var keyName = localStorage.key(j);
                  if (!keyName) continue;
                  if (
                    keyName.indexOf('SAVIOR_SETTINGS') !== -1 ||
                    keyName.indexOf('SAVIOR_POSITIONS') !== -1 ||
                    keyName.indexOf('SAVIOR_TRADELOGS') !== -1 ||
                    keyName.indexOf('SAVIOR_ACCOUNT') !== -1 ||
                    keyName.indexOf('SCANNER_CONFIG') !== -1 ||
                    keyName.indexOf('SCANNER_ACTION_CONFIG') !== -1 ||
                    keyName.indexOf('BINANCE_API') !== -1
                  ) {
                    continue;
                  }
                  if (
                    keyName.indexOf('CACHE_MAP') !== -1 ||
                    keyName.indexOf('SCANNER_CACHE') !== -1 ||
                    keyName.indexOf('EXPIRED') !== -1 ||
                    keyName.indexOf('SAVIOR_LOGS') !== -1 ||
                    keyName.indexOf('SAVIOR_SYSTEM_MONITOR_LOGS') !== -1 ||
                    keyName.indexOf('SAVIOR_CRASH_BLACKBOX') !== -1 ||
                    keyName.indexOf('DOM_TRACKER') !== -1
                  ) {
                    keysToPurge.push(keyName);
                  }
                }
                keysToPurge.forEach(function(k) {
                  try { localStorage.removeItem(k); } catch(e){}
                });
                localStorage.setItem("SAVIOR_INSTALLED_BUILD_SIG", CURRENT_BUILD_SIG);
                console.log("[Boot Shield] ✅ 静默对齐与整理完成");
              }
            } catch(migErr) {
              console.warn("[Boot Shield] 迁移非致命提示:", migErr);
            }
          }, 0);

          // 🛡️ [2. 极速平跳与秒级解锁遮罩 (Instant Sub-second Dismissal)]
          var dismissed = false;
          function dismissShield() {
            if (dismissed) return;
            dismissed = true;
            if (bar) bar.style.width = '100%';
            if (text) text.innerText = '系统就绪';
            if (shield) {
              shield.style.transition = 'opacity 0.1s ease, transform 0.1s ease';
              shield.style.opacity = '0';
              shield.style.transform = 'scale(1.005)';
              shield.style.pointerEvents = 'none';
              setTimeout(function() {
                try {
                  if (shield && shield.parentNode) shield.parentNode.removeChild(shield);
                } catch(e){}
              }, 110);
            }
          }

          // 暴露一键自愈与强制重载函数，打破无限死循环
          window.__SAVIOR_FORCE_RELOAD__ = function() {
            var rootEl = document.getElementById('root');
            var isReactRendered = rootEl && (
              window.__MAIN_APP_MOUNTED__ || 
              window.isReactReady || 
              rootEl.querySelector('[data-reactroot], header, nav, main, div[class*="bg-"]')
            );
            if (isReactRendered) {
              dismissShield();
              return;
            }
            window.__BOOT_FATAL_ERROR__ = null;
            try {
              localStorage.removeItem('SAVIOR_LOGS');
              localStorage.removeItem('SAVIOR_SYSTEM_MONITOR_LOGS');
            } catch(e){}
            window.location.href = window.location.pathname + '?force_boot=' + Date.now();
          };

          window.__SAVIOR_REPAIR_CACHE__ = function() {
            try {
              var keysToKeep = ['SAVIOR_SETTINGS', 'SAVIOR_POSITIONS', 'SAVIOR_ACCOUNT', 'SAVIOR_TRADELOGS'];
              var keysToPurge = [];
              for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && !keysToKeep.some(function(keep) { return k.indexOf(keep) !== -1; })) {
                  if (k.indexOf('CACHE') !== -1 || k.indexOf('LOG') !== -1 || k.indexOf('SCANNER') !== -1) {
                    keysToPurge.push(k);
                  }
                }
              }
              keysToPurge.forEach(function(k) { try { localStorage.removeItem(k); } catch(e){} });
            } catch(e){}
            alert('已成功清理缓存并重置状态，保留持仓与设置，正在为您重启系统...');
            window.location.href = window.location.pathname + '?cache_repaired=' + Date.now();
          };

          // 监听 React 挂载就绪广播事件
          window.addEventListener('SAVIOR_APP_READY', dismissShield);

          // 🛡️ [3. 毫秒级极速探针看门狗 (持续巡检，即使超时也不停掉巡检)]
          var elapsed = 0;
          var retryCount = 0;
          var hasAutoHealed = false;

          var watchdog = setInterval(function() {
            elapsed += 50;

            // 只要检测到主程序挂载，毫秒级直接解散遮罩！
            var rootEl = document.getElementById('root');
            var isReactRendered = rootEl && (
              window.__MAIN_APP_MOUNTED__ || 
              window.isReactReady || 
              rootEl.querySelector('[data-reactroot], header, nav, main, div[class*="bg-"]')
            );

            if (isReactRendered) {
              clearInterval(watchdog);
              dismissShield();
              return;
            }

            // 丝滑进度动画推进
            if (bar && text) {
              if (elapsed < 300) {
                bar.style.width = '65%';
                text.innerText = '正在初始化交易引擎...';
              } else if (elapsed < 800) {
                bar.style.width = '85%';
                text.innerText = '正在预热行情通道...';
              } else if (elapsed < 2000) {
                bar.style.width = '95%';
                text.innerText = '正在进入系统...';
              } else if (elapsed >= 2000 && elapsed < 10000) {
                bar.style.width = Math.min(99, 90 + Math.floor((elapsed - 2000) / 1000) * 2) + '%';
                if (!hasAutoHealed) {
                  hasAutoHealed = true;
                  retryCount++;
                  text.innerText = '系统正在完成自愈并启动 (第 ' + retryCount + '/5 次重试)...';
                  try {
                    localStorage.removeItem('SAVIOR_LOGS');
                  } catch(e){}
                } else if (elapsed % 1500 === 0 && retryCount < 5) {
                  retryCount++;
                  text.innerText = '系统正在完成自愈并启动 (第 ' + retryCount + '/5 次重试)...';
                }
              }
            }

            // 🛡️ [看门狗兜底保障]: 达到 10 秒超时或捕获到异常时展开一键修复，但保持看门狗继续轮询！
            if (elapsed >= 10000 || window.__BOOT_FATAL_ERROR__) {
              if (bar) bar.style.width = '100%';
              if (text) text.innerText = window.__BOOT_FATAL_ERROR__ 
                ? '系统检测到启动异常，请使用下方工具一键自愈恢复：' 
                : '系统重试超时，已为您准备一键自愈修复工具：';
              if (tools) tools.style.display = 'flex';
            }
          }, 50);

          // 宽泛拦截前端启动异常 (包含打包后的 bundle 脚本抛错与未捕获异常)
          window.addEventListener('error', function(e) {
            try {
              var errMsg = e.message || (e.error && e.error.message) || '未捕获的启动脚本异常';
              // 忽略非致命网络图片加载失败
              if (e.target && (e.target.tagName === 'IMG' || e.target.tagName === 'LINK')) return;
              window.__BOOT_FATAL_ERROR__ = errMsg;
              if (diag) {
                diag.style.display = 'block';
                diag.innerText = '启动自愈提示: ' + errMsg;
              }
            } catch(_) {}
          });
        })();
      </script>
    </div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
